run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gosec
    - revive
    - gofmt
    - goimports

linters-settings:
  gosec:
    excludes:
      - G404  # weak random — not used for security
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec