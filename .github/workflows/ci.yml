name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [shared, bot, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (worker/bot only)
        if: matrix.component != 'shared'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install shared module
        run: pip install -e shared/python[dev]
      - name: Install component dependencies
        run: |
          if [ -f "${{ matrix.component }}/requirements-dev.txt" ]; then
            pip install -r "${{ matrix.component }}/requirements-dev.txt"
          elif [ -f "${{ matrix.component }}/requirements.txt" ]; then
            pip install -r "${{ matrix.component }}/requirements.txt"
          fi
      - name: Ruff lint
        run: |
          if [ -f "${{ matrix.component }}/pyproject.toml" ] || [ -d "${{ matrix.component }}/tests" ]; then
            ruff check "${{ matrix.component }}"
          fi
      - name: Pytest
        working-directory: ${{ matrix.component }}
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ matrix.component }}:${{ github.workspace }}/shared/python
          TELEGRAM_BOT_TOKEN: test-token
          REDIS_URL: redis://localhost:6379/0
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "no tests in ${{ matrix.component }}"
          fi

  go:
    name: Go (golangci-lint + go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api/go.sum
      - name: Download modules
        working-directory: api
        run: go mod download
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: api
          args: --timeout=3m
      - name: Test
        working-directory: api
        run: go test ./... -count=1 -race -coverprofile=coverage.out

  node:
    name: Node (eslint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build